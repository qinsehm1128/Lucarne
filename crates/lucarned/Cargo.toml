[package]
name = "lucarned"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-process lucarne daemon composition root."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = []
memory-profiling = ["lucarne/memory-profiling"]
# Optional remote-access subsystem (Locked decision L6/L8): pulls the tunnel
# provider registry, the terminal gateway, the rmux monitor, and the web chat
# bridge. Default daemon builds MUST NOT pull any of these — keep `default = []`.
remote = [
    "dep:lucarne-remote",
    "dep:lucarne-termgw",
    "dep:lucarne-rmux",
    "dep:lucarne-web",
    "dep:axum",
]
# Optional interactive terminal dashboard (`lucarned tui`). Implies `remote`
# (reuses the loopback control plane + provider registry, which already pulls
# `lucarne-rmux`) and additionally pulls the ratatui/crossterm TUI stack, the
# shared archive store, and the QR helper migrated from the old `term` CLI.
# Default daemon builds MUST NOT pull ratatui/crossterm — keep `default = []`.
tui = [
    "remote",
    "dep:ratatui",
    "dep:crossterm",
    "dep:lucarne-archive",
    "dep:qrcode",
]

[[bin]]
name = "lucarned"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
lucarne = { path = "../lucarne" }
lucarned-ctl = { path = "../lucarned-ctl", features = ["updates"] }
lucarne-adapter = { path = "../lucarne-adapter" }
lucarne-telegram = { path = "../lucarne-telegram" }
lucarne-wechat = { path = "../lucarne-wechat" }
# Remote-access subsystem deps — optional, gated behind the `remote` feature so
# the default daemon build does not compile or link any of them.
lucarne-remote = { path = "../lucarne-remote", optional = true }
lucarne-termgw = { path = "../lucarne-termgw", optional = true }
lucarne-rmux = { path = "../lucarne-rmux", optional = true }
lucarne-web = { path = "../lucarne-web", optional = true }
# axum is only needed to merge the terminal gateway + web chat onto one loopback
# port (the single converter); pulled in only under `remote`.
axum = { workspace = true, optional = true }
# Interactive TUI dashboard deps — optional, gated behind the `tui` feature so
# the default daemon build pulls no ratatui/crossterm. ratatui 0.30 ships the
# crossterm 0.29 backend by default, so the two stay on one crossterm major.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
# Shared terminal-session archive store + QR/secret-prompt helpers migrated from
# the old `term` CLI; only needed by the `tui` feature.
lucarne-archive = { path = "../lucarne-archive", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# `blocking` is needed by the migrated `go-public` control-plane call in the TUI
# (kept synchronous, mirroring the old `term` thin wrapper); it is additive and
# does not affect the daemon's async `reqwest::Client` usage.
reqwest = { workspace = true, features = ["blocking"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
