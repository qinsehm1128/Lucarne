[package]
name = "lucarned"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-process lucarne daemon composition root."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = []
memory-profiling = ["lucarne/memory-profiling"]

[[bin]]
name = "lucarned"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
lucarne = { path = "../lucarne" }
lucarned-ctl = { path = "../lucarned-ctl", features = ["updates"] }
lucarne-adapter = { path = "../lucarne-adapter" }
lucarne-telegram = { path = "../lucarne-telegram" }
lucarne-wechat = { path = "../lucarne-wechat" }
lucarne-remote = { path = "../lucarne-remote" }
lucarne-termgw = { path = "../lucarne-termgw" }
lucarne-rmux = { path = "../lucarne-rmux" }
axum = { workspace = true }
# ratatui 0.30 ships the crossterm 0.29 backend by default, so the two stay on
# one crossterm major.
ratatui = { version = "0.30" }
crossterm = { version = "0.29" }
qrcode = { version = "0.14.1", default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# `blocking` is needed by the migrated `go-public` control-plane call in the TUI
# (kept synchronous, mirroring the old `term` thin wrapper); it is additive and
# does not affect the daemon's async `reqwest::Client` usage.
reqwest = { workspace = true, features = ["blocking"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
