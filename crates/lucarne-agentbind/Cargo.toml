[package]
name = "lucarne-agentbind"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# Bind an rmux pane to the agent session running inside it. An agent started
# interactively in a pane (claude/codex) emits no structured stream to us, but it
# DOES write a transcript file keyed by cwd. Given the pane's cwd we locate that
# transcript and parse it into chat bubbles — so an interactive agent can still be
# shown (and, via pane input, driven) in chat mode. Zero heavy deps; the robust
# upstream form would reuse Lucarne's `agent-sessions` parser.

[dependencies]
serde_json = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
