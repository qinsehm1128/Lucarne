[package]
name = "lucarne-termctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The thin `term` CLI for the rmux terminal monitor: a wrapper over the `rmux`
# binary plus the shared archive store. It operates the SAME system rmux daemon
# the gateway monitors and the SAME archive store the web uses, so no
# control-plane IPC is introduced and CLI/web stay in sync.

[[bin]]
name = "lucarne-term"
path = "src/main.rs"

[dependencies]
lucarne-archive = { path = "../lucarne-archive" }
# The `go-public` flow enumerates built-in tunnel providers + their required
# fields (lucarne-remote), drives the daemon's loopback control plane over HTTP
# (reqwest blocking — keep `main` synchronous, mirroring the thin-wrapper style),
# and renders a terminal QR of the login URL (qrcode, same version as
# lucarne-wechat). The workspace reqwest lacks the `blocking` feature, so this is
# a crate-local dep with `blocking` + `json`.
lucarne-remote = { path = "../lucarne-remote" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
qrcode = { version = "0.14.1", default-features = false }
# L2: no-echo prompt for secret provider fields (cloudflare token) so the secret
# is never echoed to the terminal.
rpassword = "7"
serde = { workspace = true }
serde_json = { workspace = true }
